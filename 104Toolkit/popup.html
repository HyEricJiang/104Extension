<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>104 招募工作台</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup-window">
  <main class="app-shell">
    <header class="app-header">
      <div class="brand"><span class="wordmark" aria-hidden="true">104</span><h1>招募工作台</h1></div>
      <span id="globalStatus" class="status-badge status-idle">待命</span>
    </header>
    <div class="workspace">
      <div class="mode-tabs" role="tablist" aria-label="工作模式" aria-orientation="vertical">
        <button id="dataTab" class="mode-tab" type="button" role="tab" aria-selected="true" aria-controls="dataWorkflow">邀約</button>
        <button id="tagTab" class="mode-tab" type="button" role="tab" aria-selected="false" aria-controls="tagWorkflow" tabindex="-1">標籤</button>
        <button id="settingsTab" class="mode-tab" type="button" role="tab" aria-selected="false" aria-controls="settingsWorkflow" tabindex="-1">設定</button>
      </div>
      <div class="workspace-content">
        <section id="dataWorkflow" role="tabpanel" aria-labelledby="dataTab">
          <section class="workflow-card" aria-labelledby="jobGroupTitle">
            <div class="section-heading"><h2 id="jobGroupTitle">加入職缺群組</h2><span id="jobCurrentGroup" class="scope-badge">尚未分類</span></div>

            <label class="sr-only" for="jobGroupSelect">選擇目前履歷的職缺</label>
            <div class="job-group-controls">
              <select id="jobGroupSelect" disabled aria-describedby="jobGroupStatus"><option value="">請選擇職缺</option></select>
              <button id="addJobGroup" type="button" class="button button-secondary" disabled>加入群組</button>
            </div>
            <p id="jobGroupStatus" class="status-message" aria-live="polite">正在讀取職缺群組…</p>
          </section>
          <section class="workflow-card" aria-labelledby="workflowTitle">
            <div class="section-heading">
              <h2 id="workflowTitle">登錄邀約</h2>
              <span class="scope-badge">本頁往右</span>
            </div>
            <p class="section-copy">處理本頁及右側連續的 104 履歷。</p>
            <button id="startWorkflow" class="button button-primary button-block">
              <span>登錄邀約＋匯出 PDF</span>
              <span aria-hidden="true">→</span>
            </button>
            <button id="inviteCurrent" type="button" class="button button-quiet" disabled>只登錄本頁</button>
              <button id="inviteRight" type="button" class="button button-quiet">只登錄本頁往右</button>
            <button id="stopWorkflow" class="button button-danger button-block is-hidden">停止目前工作流</button>
            <div class="progress-region" aria-live="polite">
              <div class="progress-meta">
                <span id="workflowPhase">尚未開始</span>
                <span id="workflowProgress">0 / 2</span>
              </div>
              <div class="progress-track"><div id="workflowBar" class="progress-bar"></div></div>
              <p id="workflowMessage" class="status-message"></p>
              <a id="inviteSheetLink" hidden target="_blank" rel="noopener">查看寫入列 ↗</a>
            </div>
          </section>

          <section class="preview" aria-label="PDF 檔名預覽">
            <span>PDF 檔名預覽</span>
            <strong id="filenamePreview">王小明_104邀約.pdf</strong>
            <strong id="trainingFilenamePreview" hidden></strong>
            <p id="groupHint" class="helper-text"></p>
          </section>
          <details class="other-actions">
            <summary>只匯出 PDF</summary>
            <div class="other-body">
              <section id="exportPanel" class="standalone-panel" aria-labelledby="exportPanelTitle">
                <div class="section-heading compact">
                  <h3 id="exportPanelTitle">匯出履歷 PDF</h3>
                  <span id="pdfProgress" class="count-badge">0 / 0</span>
                </div>
                <div class="button-grid">
                  <button id="downloadCurrent" class="button button-primary">匯出本頁</button>
                  <button id="downloadRight" class="button button-secondary">本頁往右匯出</button>
                </div>
                <button id="stopPdf" class="button button-danger button-block" disabled>停止 PDF 匯出</button>
                <div id="pdfStatus" class="detail-status" aria-live="polite">待命中</div>
              </section>
            </div>
          </details>
        </section>
        <section id="tagWorkflow" role="tabpanel" aria-labelledby="tagTab" hidden>
          <div class="workflow-card">
            <div class="section-heading"><h2>選擇模型訓練分類</h2><span id="classificationGroup" class="scope-badge">尚未標記</span></div>
            <p class="section-copy">為目前履歷保存模型訓練分類。</p>
            <div id="classificationActions" class="classification-actions">
              <button type="button" class="classification-button" data-category="systemRecommendedUnsuitable" aria-pressed="false" disabled>系統推薦但不合適</button>
              <button type="button" class="classification-button" data-category="reviewedShouldRecommend" aria-pressed="false" disabled>人工審核但需要推薦</button>
              <button type="button" class="classification-button" data-category="reviewedShouldExclude" aria-pressed="false" disabled>人工審核但應該排除</button>
              <button type="button" class="classification-button" data-category="wronglyExcludedNeedsReview" aria-pressed="false" disabled>不應排除需人工審核</button>
              <button type="button" class="classification-button" data-category="wronglyExcludedShouldRecommend" aria-pressed="false" disabled>不應排除應推薦</button>
            </div>
            <label class="field" for="trainingReason"><span>目前履歷的錯位原因（選填）</span></label>
            <textarea id="trainingReason" rows="3" maxlength="10000" placeholder="例如：最近工作以客服為主，缺少此職缺需要的 Java 開發經驗" aria-describedby="reasonHint reasonStatus" disabled></textarea>
            <p id="reasonHint" class="helper-text">自動儲存。標籤與原因會出現在 AI 訓練版的標註首頁。</p>
            <p id="reasonStatus" class="status-message" aria-live="polite"></p>
            <button id="removeTrainingLabel" type="button" class="button button-secondary button-block" disabled>移除標籤與原因</button>
            <p id="classificationStatus" class="status-message" aria-live="polite">正在讀取目前分頁…</p>
          </div>
        </section>
        <section id="settingsWorkflow" role="tabpanel" aria-labelledby="settingsTab" hidden>
          <section class="settings-card" aria-labelledby="settingsTitle">
            <h2 id="settingsTitle">PDF 匯出設定</h2>
            <div class="setting-row">
              <div><h3>存放資料夾</h3><p id="outputLocation" class="helper-text" aria-live="polite">讀取中…</p></div>
              <button id="chooseOutputDirectory" type="button" class="button button-secondary">變更資料夾</button>
            </div>
            <details class="other-actions">
              <summary>進階設定</summary>
              <div class="other-body">
                <div class="field-grid">
                  <label class="field">首份等待（ms）<input id="firstWait" type="number" min="0"></label>
                  <label class="field">後續等待（ms）<input id="nextWait" type="number" min="0"></label>
                </div>
                <p id="settingsStatus" class="helper-text" role="status">變更會自動儲存</p>
              </div>
            </details>
            <p id="toolkitVersion" class="helper-text version">正在確認工作台版本…</p>
          </section>
        </section>
      </div>
    </div>
  </main>
  <script src="output-directory.js"></script>
  <script src="training-labels.js"></script>
  <script src="popup.js"></script>
</body>
</html>
