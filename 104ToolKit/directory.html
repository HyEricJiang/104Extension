<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選擇履歷存放位置</title><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="directory.css"></head>
<body><main class="app-shell">
<header class="app-header"><div><p class="eyebrow">104 RECRUITING TOOLKIT</p><h1>選擇存放資料夾</h1><p class="header-copy">一般履歷與 AI 訓練資料都會存放在這裡。</p></div></header>
<section class="workflow-card"><h2>目前存放位置</h2><p id="directoryLocation" class="detail-status">讀取中…</p><p class="helper-text">顯示所選資料夾名稱；瀏覽器不提供完整磁碟路徑。</p>
<button id="authorizeExport" type="button" class="button button-primary button-block" hidden>授權並繼續匯出</button>
<button id="pickDirectory" type="button" class="button button-primary button-block">選擇資料夾</button>
<button id="defaultDirectory" type="button" class="button button-secondary button-block">使用瀏覽器預設下載位置</button>
<p class="helper-text">匯出期間請保留此工具頁；可返回履歷繼續作業。</p>
<p id="directoryStatus" class="status-message" aria-live="polite"></p>
<button id="returnToResume" type="button" class="button button-secondary button-block">完成並返回原分頁</button>
</section></main><script src="output-directory.js"></script><script src="directory.js"></script></body>
</html>
