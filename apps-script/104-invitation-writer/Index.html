<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; color: #182a42; background: #f4f7fb; padding: 32px 20px; }
    main { max-width: 38rem; margin: auto; background: white; padding: 24px 32px; border-radius: 12px; }
    a, button { color: #1759a3; }
  </style>
</head>
<body>
  <main id="hytech-104-invite-writer">
    <h1>104 履歷登錄</h1>
    <p id="status" role="status">等待 104 招募工作台傳送資料…</p>
    <button id="retry" type="button" hidden>重試本批資料</button>
    <p><a id="sheet" href="https://docs.google.com/spreadsheets/d/REPLACE_WITH_SPREADSHEET_ID/edit#gid=61635491" target="_blank" rel="noopener">開啟邀約紀錄</a></p>
  </main>
  <script>
    const panel = "hytech-104-invite-writer";
    const origin = location.origin;
    const status = document.getElementById("status");
    const retry = document.getElementById("retry");
    let batch;
    let finished = false;

    function submit() {
      retry.hidden = true;
      status.textContent = `正在登錄 ${batch.rows.length} 筆資料…`;
      google.script.run.withSuccessHandler(result => {
        const last = result.firstRow + result.count - 1;
        const skipped = batch.skipped ? ` 略過 ${batch.skipped} 頁，原因為群組未對應或履歷資料不完整。` : "";
        status.textContent = `已由 ${result.recruiter} 登錄 ${result.count} 筆，列號 ${result.firstRow}–${last}。${skipped}`;
        document.getElementById("sheet").href += `&range=A${result.firstRow}:I${last}`;
        window.postMessage({ panel, type: "saved", batchId: batch.batchId }, origin);
        finished = true;
        batch = null;
      }).withFailureHandler(error => {
        status.textContent = `登錄失敗：${error.message || "請稍後重試。"}`;
        retry.hidden = false;
      }).submitInvitations(batch);
    }

    retry.addEventListener("click", submit);
    window.addEventListener("message", event => {
      if (event.source !== window || event.origin !== origin ||
          event.data?.panel !== panel || event.data.type !== "payload" || batch || finished) return;
      if (event.data.payload) {
        batch = event.data.payload;
        submit();
      }
    });
    window.postMessage({ panel, type: "ready" }, origin);
    setTimeout(() => {
      if (!batch && !finished) status.textContent = "目前沒有待登錄的資料。請從 104 招募工作台啟動，或重新載入此頁接續登入後的批次。";
    }, 5000);
  </script>
</body>
</html>
